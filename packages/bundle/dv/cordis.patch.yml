# The DreamVerse bundle patch: the DreamVerse plugins over dsh-base, for a profile that also stacks dsh-web-app (the
# chat page) or dsh-headless (one task per process). Every row reads its configuration from the environment that
# scripts/video-harness/launch.sh prepares:
#   DV_BACKEND_URL   FastVideo streaming_v2 server of the ref2va render mode (default http://127.0.0.1:8029)
#   DV_T2VA_BACKEND_URL  FastVideo streaming_v2 server of the t2va render mode (FastVideo/FastVideo-FastH3-8-Step-V2);
#                        unset, the t2va render mode is not mounted
#   DV_STATE_ROOT    where assets, project records, session bindings, and view state live (default ~/.local/state/dv)
#   DV_FFMPEG / DV_FFPROBE  media binaries
#   DV_PUBLIC_URL    origin that serves /dv/assets to remote viewers, for links in chat cards
#   DV_AGENT_PROVIDER / DV_AGENT_MODEL / DV_AGENT_REASONING  the agent's model route
#   DV_DEEPSEEK_BASE_URL  the OpenAI-compatible SGLang endpoint that serves DeepSeek (default http://10.244.6.153:30000/v1)
#   DV_DEEPSEEK_API_KEY   bearer token for that endpoint; the launch script exports `none` when unset
#   DV_AGENT_VISION       `0` makes inspect.image report that images are unsupported instead of calling the model
#   GROQ_API_KEY          key of the documented fallback route

- insert:
    # The render mode registries dvRef2va and dvT2va. Each provider row below registers one renderer under its `backend`
    # name; Shot render registers dv_shot_render_<mode> only while that mode has a renderer. Add a provider row (with a
    # distinct `backend`) to offer another backend of the same mode.
    - id: dv-render-modes
      name: '@dv/render-modes'

    - id: dv-fasth3-ref2va
      name: '@dv/fasth3-ref2va'
      config:
        baseUrl: !!js process.env.DV_BACKEND_URL || 'http://127.0.0.1:8029'

    # Mounted only when DV_T2VA_BACKEND_URL names a t2va backend; without it the agent has no dv_shot_render_t2va tool.
    - id: dv-fasth3-t2va
      name: '@dv/fasth3-t2va'
      disabled: !!js "!process.env.DV_T2VA_BACKEND_URL"
      config:
        baseUrl: !!js process.env.DV_T2VA_BACKEND_URL

    - id: dv-ffmpeg
      name: '@dv/ffmpeg'
      config:
        ffmpegPath: !!js process.env.DV_FFMPEG || '/mnt/lustre/vlm-d1su/opt/ffmpeg-native/bin/ffmpeg'
        ffprobePath: !!js process.env.DV_FFPROBE || 'ffprobe'

    - id: dv-project
      name: '@dv/project'
      config:
        root: !!js >-
          process.getBuiltinModule('node:path').join(
          process.env.DV_STATE_ROOT || process.getBuiltinModule('node:path').join(
          process.getBuiltinModule('node:os').homedir(), '.local/state/dv'), 'projects')
        sessionRoot: !!js >-
          process.getBuiltinModule('node:path').join(
          process.env.DV_STATE_ROOT || process.getBuiltinModule('node:path').join(
          process.getBuiltinModule('node:os').homedir(), '.local/state/dv'), 'sessions')

    - id: dv-asset-pool
      name: '@dv/asset-pool'
      config:
        publicBaseUrl: !!js process.env.DV_PUBLIC_URL || ''
        root: !!js >-
          process.getBuiltinModule('node:path').join(
          process.env.DV_STATE_ROOT || process.getBuiltinModule('node:path').join(
          process.getBuiltinModule('node:os').homedir(), '.local/state/dv'), 'assets')

    - id: dv-inspector
      name: '@dv/inspector'
      config:
        imageInput: !!js process.env.DV_AGENT_VISION !== '0'

    - id: dv-shot-plan
      name: '@dv/shot-plan'

    - id: dv-shot-render
      name: '@dv/shot-render'

    - id: dv-story-bible
      name: '@dv/story-bible'

    - id: dv-timeline
      name: '@dv/timeline'

    - id: dv-deliver
      name: '@dv/deliver'

    # dv: mentions in chat messages and chat image import.
    - id: dv-chat-references
      name: '@dv/chat-references'

    # The browser API for the interface plugins, and the interface plugins themselves.
    - id: dv-api
      name: '@dv/api'
      config:
        keepaliveMs: 15000
        stateRoot: !!js >-
          process.env.DV_STATE_ROOT || process.getBuiltinModule('node:path').join(
          process.getBuiltinModule('node:os').homedir(), '.local/state/dv')

    - id: dv-ui-composer
      name: '@dv/ui-composer'

    - id: dv-ui-canvas
      name: '@dv/ui-canvas'

    - id: dv-ui-timeline
      name: '@dv/ui-timeline'

    - id: dv-ui-asset-pool
      name: '@dv/ui-asset-pool'

    - id: dv-ui-history
      name: '@dv/ui-history'

    - id: dv-ui-shell
      name: '@dv/ui-shell'

# The video-directing skill ships in this bundle's skills directory; skill-filesystem discovers it beside the user's own.
# The model and timeline skills are registered by their plugins through ctx.skills.
- id: skill-filesystem
  config:
    customSkillDirs:
      - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@dv/bundle/package.json')), 'skills')

# DreamVerse identity. The host prompt drops the harness opener and states the creator-facing persona, which the
# headless profile uses as is; the Web surface's prompt section (Web GUI URL, harness checkout) is left out, because
# creators talk to a video assistant, not to a coding harness.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: &dreamverse-persona >-
      You are the DreamVerse video assistant. You help creators plan, render, and edit videos in their DreamVerse
      project: characters and reference images, shots, takes, and the clips of each timeline. You work only through
      the dv_* video tools and the skills listed for you; you have no shell, file, or web access. Reply in the language of
      the user's latest message, in plain words a creator understands; mention record IDs, asset IDs, and tool names
      only when the user asks for them. Call the video model "DreamVerse 视频模型" and never name a model codename or ID.
    personaSuffix: ''

- id: web-runtime
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    surfaceContext: false
    trustedHosts: !!js ctx.webStartup.trustedHosts

# The Web agent preset of every DreamVerse chat: the persona above, the directing skills only, questions to the user,
# and context compaction. It mounts no shell, file, web, delegation, goal, or plan-mode tools; the video tools come
# from the dv-* rows on the host. The chooser is hidden, so every chat uses this preset.
- id: agent-preset-registry
  config:
    default: dreamverse
    modeSelectionEnabled: false

- insert:
    - id: preset-dreamverse
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dreamverse
        name: DreamVerse
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: *dreamverse-persona
              includeRuntimeContext: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@dv/bundle/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

# The agent model: DeepSeek V4.1 served by SGLang on the cluster through its OpenAI-compatible API. No installed pi-ai
# catalog describes that server, so the route is declared by hand with the model's modalities and thinking levels; the
# server accepts the catalog id `deepseek-v4.1` as sent. pi-ai's OpenAI implementation insists on a bearer token, so the
# launch script exports DV_DEEPSEEK_API_KEY=none for a keyless server. Groq stays available as the documented fallback:
# DV_AGENT_PROVIDER=groq DV_AGENT_MODEL=qwen/qwen3.8-27b.
- id: llm-pi-ai
  config:
    providers:
      deepseek-local:
        apiKeyEnv: DV_DEEPSEEK_API_KEY
        api: openai-completions
        baseURL: !!js process.env.DV_DEEPSEEK_BASE_URL || 'http://10.244.6.153:30000/v1'
        models:
          - id: deepseek-v4.1
            name: DeepSeek V4.1 (SGLang)
            input: [text, image]
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
      groq:
        apiKeyEnv: GROQ_API_KEY

- id: agent-default-model
  config:
    provider: !!js process.env.DV_AGENT_PROVIDER || 'deepseek-local'
    model: !!js process.env.DV_AGENT_MODEL || 'deepseek-v4.1'
    reasoningEffort: !!js process.env.DV_AGENT_REASONING || 'low'

# DreamVerse references project items through @dv/ui-composer's `@` source; DSH's file and session `@`
# source would list the project's record files and the sessions of every project.
- id: ui-reference
  disabled: true

# The model is fixed by agent-default-model; the composer shows no model picker and no /model command.
- id: ui-model-selection
  disabled: true

# The agent's skills are its own procedures; the composer's / menu does not list them to creators.
- id: ui-skill
  disabled: true

# Completed turns show no token-usage pill; the composer statistics are hidden by @dv/ui-shell.
- id: ui-chat
  config:
    performanceUsage: compact
