# The DreamVerse bundle patch: mounts the DreamVerse port (packages/dreamverse/) over dsh-base.
# Every row reads its configuration from the environment that scripts/dreamverse/launch-harness.sh
# prepares. A missing required variable fails its plugin at load with the schema's message.

- insert:
    # DREAMVERSE_GENERATION_URL is the HTTP base URL of the generation backend (launch-generation.sh).
    - id: dreamverse-generation-client
      name: '@dreamverse/generation-client'
      config:
        baseUrl: !!js process.env.DREAMVERSE_GENERATION_URL

    # The reference `load_application_settings` asset root: <FASTVIDEO_DREAMVERSE_HOME or
    # $XDG_STATE_HOME/fastvideo/dreamverse or ~/.local/state/fastvideo/dreamverse>/assets.
    - id: dreamverse-assets-manager
      name: '@dreamverse/assets-manager'
      config:
        root: !!js >-
          process.getBuiltinModule('node:path').join(
          process.env.FASTVIDEO_DREAMVERSE_HOME || process.getBuiltinModule('node:path').join(
          process.env.XDG_STATE_HOME || process.getBuiltinModule('node:path').join(
          process.getBuiltinModule('node:os').homedir(), '.local/state'), 'fastvideo/dreamverse'),
          'assets')

    # The reference prompt-enhancement variables.
    - id: dreamverse-prompt-enhancer
      name: '@dreamverse/prompt-enhancer'
      config:
        cerebrasApiKey: !!js process.env.CEREBRAS_API_KEY
        groqApiKey: !!js process.env.GROQ_API_KEY
        model: !!js process.env.FASTVIDEO_PROMPT_MODEL
        cerebrasModel: !!js process.env.FASTVIDEO_PROMPT_CEREBRAS_MODEL
        groqModel: !!js process.env.FASTVIDEO_PROMPT_GROQ_MODEL
        groqApiBaseUrl: !!js process.env.FASTVIDEO_PROMPT_GROQ_API_BASE_URL
        cerebrasBaseUrl: !!js process.env.CEREBRAS_BASE_URL
        enhanceSystemPromptPath: !!js process.env.FASTVIDEO_PROMPT_ENHANCE_SYSTEM_PROMPT_PATH
        autoSystemPromptPath: !!js process.env.FASTVIDEO_PROMPT_AUTO_SYSTEM_PROMPT_PATH
        rewriteAllSystemPromptPath: !!js process.env.FASTVIDEO_PROMPT_REWRITE_ALL_SYSTEM_PROMPT_PATH
        rewriteUserSystemPromptPath: !!js process.env.FASTVIDEO_PROMPT_REWRITE_USER_SYSTEM_PROMPT_PATH

    # The reference `load_application_settings` project log root: FASTVIDEO_PROJECT_LOG_ROOT, else
    # <FASTVIDEO_DREAMVERSE_HOME or $XDG_STATE_HOME/fastvideo/dreamverse or ~/.local/state/fastvideo/dreamverse>/outputs/project_logs.
    - id: dreamverse-project
      name: '@dreamverse/project'
      config:
        projectLogRoot: !!js >-
          (process.env.FASTVIDEO_PROJECT_LOG_ROOT ?? process.getBuiltinModule('node:path').join(
          process.env.FASTVIDEO_DREAMVERSE_HOME || process.getBuiltinModule('node:path').join(
          process.env.XDG_STATE_HOME || process.getBuiltinModule('node:path').join(
          process.getBuiltinModule('node:os').homedir(), '.local/state'), 'fastvideo/dreamverse'),
          'outputs/project_logs')).trim()

    - id: dreamverse-action-generate-video-sequence
      name: '@dreamverse/user-actions/generate-video-sequence'

    - id: dreamverse-action-generate-single-clip
      name: '@dreamverse/user-actions/generate-single-clip'

    - id: dreamverse-action-continue-video
      name: '@dreamverse/user-actions/continue-video'

    - id: dreamverse-action-rewrite-video-sequence
      name: '@dreamverse/user-actions/rewrite-video-sequence'

    # The DSH web server on DREAMVERSE_BROWSER_PORT: the DreamVerse page, `/ws`, and the browser HTTP routes. No
    # compression, so route responses stay byte-identical to the reference.
    - id: dreamverse-webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: !!js process.env.DREAMVERSE_BROWSER_HOST || '127.0.0.1'
        port: !!js process.env.DREAMVERSE_BROWSER_PORT && Number(process.env.DREAMVERSE_BROWSER_PORT)
        compression: none

    # Serves the DSH page shell as the web server's fallback and prints the token URL that opens the page.
    - id: dreamverse-web-runtime
      name: '@deepseek-ai/dsh-web-app'
      config:
        openBrowser: false
        printUrl: true
        surfaceContext: false
        trustedHosts: []

    # Builds the page's plugin list and serves each browser plugin's code under /plugins.
    - id: dreamverse-client-modules
      name: '@deepseek-ai/dsh-client-modules'

    # Page authorization (token and cookie) and the /api browser connection.
    - id: dreamverse-client-connection
      name: '@deepseek-ai/dsh-client-connection'
      inject: [webRuntime]
      config:
        trustedHosts: !!js ctx.webRuntime.trustedHosts

    # The application event source that the browser connection subscribes to.
    - id: dreamverse-api-remotes
      name: '@deepseek-ai/dsh-api-remotes'

    # Mounts the page's React tree from the `root` slot.
    - id: dreamverse-ui-renderer
      name: '@deepseek-ai/dsh-client-ui-renderer'

    # DreamVerse page: fills the `root` slot and declares the child slots that the rows below fill.
    - id: dreamverse-ui-kit
      name: '@dreamverse/ui-kit'

    # Project creation and the directing composer: `dreamverse.creation-studio` and `dreamverse.chatbar`.
    - id: dreamverse-ui-creation
      name: '@dreamverse/ui-creation'

    # Live and archived playback: `dreamverse.player`.
    - id: dreamverse-ui-player
      name: '@dreamverse/ui-player'

    # The prompt event timeline: `dreamverse.workspace`.
    - id: dreamverse-ui-directing
      name: '@dreamverse/ui-directing'

    # The asset library dialog: `dreamverse.asset-library`.
    - id: dreamverse-ui-assets
      name: '@dreamverse/ui-assets'

    # Saved project history: `dreamverse.sidebar`.
    - id: dreamverse-ui-project-history
      name: '@dreamverse/ui-project-history'

    # `/ws` projects plus the health, readiness, and creation capability routes on the web server.
    - id: dreamverse-project-controller
      name: '@dreamverse/project-controller'
